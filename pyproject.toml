[project]
name = "diffguard"
version = "0.1.0"
description = "Multi-agent code review system with built-in evaluation"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.60",
    "langchain-core>=0.3.30",
    "langchain-openai>=0.3.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "mcp>=2.3.0",
]

[project.scripts]
diffguard = "diffguard.cli:main"
diffguard-mcp = "diffguard.mcp_server:main"

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/diffguard"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
